name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release
      - name: Keep the Windows programs
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: uci-analyzer-windows
          path: |
            target/release/uci-shim.exe
            target/release/uci-viewer.exe
            target/release/uci-replay.exe
            target/release/uci-demo.exe
            target/release/uci-fake-engine.exe
            uci-shim.cfg.example
            README.md
            LICENSE
